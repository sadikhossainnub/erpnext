name: ERPNext Deploy to VPS

on:
  push:
    branches:
      - erpnext-v16
      # Add more branches here if needed, e.g.:
      # - develop
      # - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code from GitHub
        uses: actions/checkout@v4

      - name: Deploy via SSH Password
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 85.190.254.51
          username: dressup
          password: "701865"
          port: 22
          script_stop: true
          script: |
            export PATH=$PATH:/home/dressup/.local/bin:/usr/local/bin
            cd ~/frappe-bench
            
            # Get the app from the specific branch that was pushed
            bench get-app --branch erpnext-v16 https://github.com/sadikhossainnub/erpnext.git
            
            # Run database migrations
            bench migrate
            
            # Clear cache
            bench clear-cache
            
            # Restart bench services
            bench restart
